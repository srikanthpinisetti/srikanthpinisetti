name: Update profile

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["projects.json", "tools/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - name: Project cards
        run: python tools/projects.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Activity
        run: python tools/activity.py
      - name: Commit changes
        run: |
          git add README.md assets/projects assets/activity.svg data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile cards"
          git push
